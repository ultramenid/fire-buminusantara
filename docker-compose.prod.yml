# Stack produksi role "prod". Database (MariaDB milik CMS Laravel), MinIO, dan
# nginx berjalan di luar stack ini — image di bawah hanya aplikasi Next.js.
# Port cuma diikat ke 127.0.0.1: host nginx yang menghadap publik.
services:
  web:
    image: ghcr.io/ultramenid/fire-buminusantara:${WEB_TAG:-latest}
    restart: unless-stopped
    # Atap memori. Unggahan laporan disangga utuh di memori (req.formData():
    # ±3–4× ukuran kiriman, jadi ±400 MB per unggahan 100 MB), dan MariaDB +
    # MinIO berbagi host ini. Tanpa atap, banjir unggahan membuat OOM killer
    # host memilih korban — bisa basis datanya. Dengan atap yang mati hanya
    # container ini, lalu restart di atas menghidupkannya lagi.
    # 2g ≈ baseline 0,3–0,5 GB + ±3 unggahan 100 MB serentak. Swap = atap
    # yang sama: tanpa swap, tak ada perlambatan diam-diam sebelum OOM.
    mem_limit: 2g
    memswap_limit: 2g
    env_file: .env
    # Layanan OCR KTP di jaringan internal compose (OCR_KUNCI ikut dari .env).
    # Bisa ditimpa dari .env; dipakai hanya bila EKYC_PROVIDER=paddleocr.
    environment:
      OCR_URL: ${OCR_URL:-http://ocr-ktp:8866}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      # Foto KTP yang menunggu keputusan petugas (KTP_DIR bawaan, lib/verifikasi-ktp.ts).
      # Di lapisan container ia hilang setiap deploy. Isinya dihapus aplikasi
      # begitu diputuskan atau setelah 30 hari — volume ini tidak perlu dicadangkan.
      - ktp-privat:/app/privat/ktp
    networks:
      # Jaringan bersama dengan MinIO/MariaDB (dibuat manual:
      # docker network create shared) — container saling memanggil dengan nama
      # layanan (http://minio:9000), tanpa lewat port host. Port 127.0.0.1
      # MinIO tidak bisa dijangkau dari container (host.docker.internal datang
      # lewat alamat bridge, bukan loopback). Layanan ini bernama `web` dan
      # layanan geoplatform `geo`: nama layanan = alias di jaringan "shared".
      - shared
      - default
    healthcheck:
      # /id dipaksa dynamic → lolos hanya jika app hidup DAN database terjangkau.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/id').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  # OCR foto KTP untuk verifikasi siaran (layanan/ocr-ktp, PaddleOCR CPU):
  # penyedia eKYC "paddleocr" (lib/ocr-ktp.ts). TANPA port terbuka — hanya web
  # yang memanggilnya lewat jaringan default compose. /tmp di tmpfs: unggahan
  # multipart yang dispool tidak pernah menyentuh disk. Tidak masuk
  # HEALTH_SERVICES: OCR mati = pengajuan ke antrean petugas, situs tetap jalan.
  ocr-ktp:
    image: ghcr.io/ultramenid/fire-buminusantara-ocr-ktp:${OCR_TAG:-latest}
    restart: unless-stopped
    # Atap: deteksi mobile + pengenal latin PP-OCRv5, sisi 960 px — terukur ±0,5–0,8 GB per foto KTP
    # (model deteksi server dengan gambar penuh ±5 GB → OOM). MariaDB + MinIO di host yang sama.
    mem_limit: 2g
    memswap_limit: 2g
    # OCR satu foto memakan CPU beberapa detik — jangan sampai merebut web.
    cpus: 2
    environment:
      OCR_KUNCI: ${OCR_KUNCI:-}
      # Harus sama dengan `cpus` di atas: thread Paddle melebihi jatah CPU = ±10× lebih lambat.
      OCR_CPU_THREADS: "2"
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8866/sehat', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  # Server video siaran langsung aplikasi mobile (lib/siaran.ts). Network host:
  # WebRTC butuh 10.001 port UDP (50000–60000) yang terlalu berat lewat NAT
  # docker. Sinyal 7880 hanya di 127.0.0.1 — nginx host yang melayani
  # wss://live.nusantara.earth (deploy/livekit.nginx.conf). Kunci API dirakit
  # dari .env yang sama dengan rute siaran, jadi tak mungkin beda pasangan.
  # Tidak masuk HEALTH_SERVICES: LiveKit mati ≠ situs di-rollback.
  livekit:
    image: livekit/livekit-server:v1.13.11
    restart: unless-stopped
    network_mode: host
    # Atap memori, alasan sama dengan web: MariaDB + MinIO di host yang sama.
    mem_limit: 1g
    memswap_limit: 1g
    command: ["--config", "/etc/livekit.yaml"]
    volumes:
      - ./deploy/livekit.yaml:/etc/livekit.yaml:ro
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:-}: ${LIVEKIT_API_SECRET:-}"

volumes:
  ktp-privat:

networks:
  shared:
    external: true